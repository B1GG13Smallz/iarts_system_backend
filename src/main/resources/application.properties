spring.application.name=iarts-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/iarts_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

app.jwt.secret=replace-this-development-secret-with-a-256-bit-production-secret
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:4200
